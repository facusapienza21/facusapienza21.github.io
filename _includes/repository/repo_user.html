{% assign user = include.user %}
<div class="repo-card repo-user-card">
  <a href="https://github.com/{{ user.username }}">
    <img class="repo-user-avatar" src="https://github.com/{{ user.username }}.png?size=160" alt="{{ user.username }}">
  </a>
  <div>
    <a href="https://github.com/{{ user.username }}" class="repo-card-title">{{ user.name }}</a>
    <div class="repo-card-owner">@{{ user.username }}</div>
    {% if user.bio %}<p class="repo-card-description mb-0">{{ user.bio }}</p>{% endif %}
  </div>
</div>
